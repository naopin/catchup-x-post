version: "3.9"

# ラジオ（catchup-news）は host:8080。X投稿用 news は 8081 で分離。
services:
  news:
    build:
      context: ../catchup-news
      dockerfile: Dockerfile
    container_name: catchup-x-post-news
    env_file:
      - ../catchup-news/.env
    ports:
      - "8081:8080"
    volumes:
      - ../catchup-news/logs:/app/logs
      - ../catchup-news/episodes:/app/episodes

  post:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      CATCHUP_NEWS_BASE_URL: http://news:8080
      LOGS_DIR: /app/logs
      OUTPUT_DIR: /app/output
    volumes:
      - ./history:/app/history
      - ./logs:/app/logs
      - ./output:/app/output
    depends_on:
      - news
    command: ["-dry-run=true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env
    ports:
      - "8082:8082"
    environment:
      CATCHUP_NEWS_BASE_URL: http://news:8080
      OUTPUT_DIR: /app/output
      LOGS_DIR: /app/logs
      HISTORY_DIR: /app/history
      PORT: 8082
    volumes:
      - ./history:/app/history
      - ./logs:/app/logs
      - ./output:/app/output
    depends_on:
      - news

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8082
    depends_on:
      - api
